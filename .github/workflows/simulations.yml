name: Simulations
on:
  push: null
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test-app-non-determinism:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: technote-space/get-diff-action@v6.1.2
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
    - uses: actions/setup-go@v5
      if: env.GIT_DIFF
      with:
        go-go-version: '1.23'
        cache: true
    - name: Test application non-determinism
      if: env.GIT_DIFF
      run: 'make test-app-non-determinism

        '
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-install-dependencies
      run: echo stepify-probe-install-dependencies
    - uses: actions/setup-go@v5
      with:
        go-go-version: '1.23'
    - name: Install runsim
      run: export GO111MODULE="on" && go install github.com/cosmos/tools/cmd/runsim@v1.0.0
    - uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-runsim-binary
    - name: stepify-tail-install-dependencies
      run: echo stepify-tail-install-dependencies
      id: _bre_install_dependencies
    - name: stepify-probe-test-app-import-export
      run: echo stepify-probe-test-app-import-export
    - uses: actions/checkout@v4
    - uses: technote-space/get-diff-action@v6.1.2
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
    - uses: actions/setup-go@v5
      if: env.GIT_DIFF
      with:
        go-go-version: '1.23'
        cache: true
    - name: test-app-import-export
      if: env.GIT_DIFF
      run: 'make test-app-import-export

        '
    - name: stepify-tail-test-app-import-export
      run: echo stepify-tail-test-app-import-export
    - name: stepify-probe-test-app-after-import
      run: echo stepify-probe-test-app-after-import
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'''
      id: _m_test_app_after_import
    - name: stepify-fault-test-app-after-import
      run: exit 1
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_after_import.conclusion
        != ''failure'''
      id: _m_test_app_after_import_1
    - uses: technote-space/get-diff-action@v6.1.2
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_after_import.conclusion
        != ''failure'' && steps._m_test_app_after_import_1.conclusion != ''failure'''
      id: _m_test_app_after_import_2
    - name: test-app-after-import
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_after_import.conclusion
        != ''failure'' && steps._m_test_app_after_import_1.conclusion != ''failure'' && steps._m_test_app_after_import_2.conclusion
        != ''failure'' && (env.GIT_DIFF)'
      run: 'make test-app-after-import

        '
      id: _m_test_app_after_import_3
    - name: stepify-tail-test-app-after-import
      run: echo stepify-tail-test-app-after-import
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_after_import.conclusion
        != ''failure'' && steps._m_test_app_after_import_1.conclusion != ''failure'' && steps._m_test_app_after_import_2.conclusion
        != ''failure'' && steps._m_test_app_after_import_3.conclusion != ''failure'''
    - name: stepify-probe-test-app-multi-seed-short
      run: echo stepify-probe-test-app-multi-seed-short
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'''
      id: _m_test_app_multi_seed_short
    - uses: technote-space/get-diff-action@v6.1.2
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_multi_seed_short.conclusion
        != ''failure'''
      id: _m_test_app_multi_seed_short_1
    - name: test-app-multi-seed-short
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_multi_seed_short.conclusion
        != ''failure'' && steps._m_test_app_multi_seed_short_1.conclusion != ''failure'' && (env.GIT_DIFF)'
      run: 'make test-app-multi-seed-short

        '
      id: _m_test_app_multi_seed_short_2
    - name: stepify-tail-test-app-multi-seed-short
      run: echo stepify-tail-test-app-multi-seed-short
      if: '!cancelled() && steps._bre_install_dependencies.conclusion == ''success'' && steps._m_test_app_multi_seed_short.conclusion
        != ''failure'' && steps._m_test_app_multi_seed_short_1.conclusion != ''failure'' && steps._m_test_app_multi_seed_short_2.conclusion
        != ''failure'''
